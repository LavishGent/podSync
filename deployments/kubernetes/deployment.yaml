# Demo Deployment for examples/ratelimit, plus a ClusterIP Service for its HTTP
# port. Apply together with headless-service.yaml (and optionally
# networkpolicy.yaml). Example only.
#
# Readiness: periodSeconds 2 keeps the window short in which a new pod is
# Ready but a peer's DNS cache has not yet seen it. headless-service.yaml sets
# publishNotReadyAddresses: true so peers can reach a hydrating pod anyway;
# repair closes whatever gap is left (FirstRepairDelay, default 15s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podsync-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podsync-app
  template:
    metadata:
      labels:
        app: podsync-app
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: podsync-ratelimit:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE
              value: podsync-headless
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LIMIT
              value: "5"
            - name: WINDOW_SECONDS
              value: "10"
          ports:
            - name: http
              containerPort: 8080
            - name: replication
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The image is distroless (no shell), so use the binary itself.
                command: ["/ratelimit", "-sleep", "2s"]
---
apiVersion: v1
kind: Service
metadata:
  name: podsync-app
spec:
  type: ClusterIP
  selector:
    app: podsync-app
  ports:
    - name: http
      port: 80
      targetPort: http
