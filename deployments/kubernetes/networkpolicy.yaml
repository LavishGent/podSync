# Example only: admit replication-port traffic solely from PodSync pods.
# Adjust the label, namespace, and port to your deployment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podsync-replication
spec:
  podSelector:
    matchLabels:
      app: podsync-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: podsync-app
      ports:
        - protocol: TCP
          port: 9090
